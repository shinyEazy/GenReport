name: gen-report

services:
  api:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    working_dir: /workspace/GenReport/src
    volumes:
      - ../:/workspace/GenReport
      - uv-cache:/root/.cache/uv
    ports:
      - "8011:8011"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      UV_SYSTEM_PYTHON: "1"
      UV_LINK_MODE: copy
      PYTHONDONTWRITEBYTECODE: "1"
      METHOD_HUB_MCP_URL: ${METHOD_HUB_MCP_URL:-http://host.docker.internal:38000/mcp}
    command:
      - /bin/sh
      - -lc
      - apt-get update && apt-get install -y --no-install-recommends file && rm -rf /var/lib/apt/lists/* && uv pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8011 --reload --reload-dir app --reload-exclude '*.pyc' --reload-exclude '__pycache__/*'
    mem_limit: 256m

volumes:
  uv-cache:
