name: gen-report

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: gen-report:local
    working_dir: /workspace/GenReport/src
    volumes:
      - ../:/workspace/GenReport
      - uv-cache:/root/.cache/uv
    env_file:
      - path: .env
        required: true
    ports:
      - "8011:8011"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      UV_SYSTEM_PYTHON: "1"
      UV_LINK_MODE: copy
      PYTHONDONTWRITEBYTECODE: "1"
      TOOL_SUBSCRIPTIONS_API_URL: ${TOOL_SUBSCRIPTIONS_API_URL:-http://host.docker.internal:8007/authz-service/api/v1/authz/me/tool-subscriptions}
      METHOD_HUB_MCP_URL: ${METHOD_HUB_MCP_URL:-http://host.docker.internal:38000/mcp}
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8011"
      - --reload
      - --reload-dir
      - app
      - --reload-exclude
      - "*.pyc"
      - --reload-exclude
      - "__pycache__/*"
    mem_limit: 256m

volumes:
  uv-cache:
